name: Publish to npm and MCP Registry

# Push a tag like v0.5.6 (matching package.json and server.json) to publish.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance + MCP Registry GitHub OIDC login
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches package.json and server.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          SERVER_VERSION="$(node -p "require('./server.json').version")"
          if [ "$TAG" != "v${PKG_VERSION}" ] || [ "$PKG_VERSION" != "$SERVER_VERSION" ]; then
            echo "::error::Tag $TAG, package.json $PKG_VERSION and server.json $SERVER_VERSION must match"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Publish package to npm (OIDC Trusted Publishing)
        run: npm publish --provenance --access public

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Wait until npm serves the new version
        run: |
          PKG="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          for i in $(seq 1 30); do
            if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
              echo "${PKG}@${VERSION} is available on npm"
              exit 0
            fi
            echo "Waiting for ${PKG}@${VERSION} (attempt $i)..."
            sleep 20
          done
          echo "::error::${PKG}@${VERSION} not visible on npm after 10 minutes"
          exit 1

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
